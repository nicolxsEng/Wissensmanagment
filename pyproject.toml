[project]
name = "sov"
version = "0.1.0"
description = "Sichtbares Wissen auf Stack Overflow vor und nach ChatGPT (TH Nürnberg, WS 2026/27)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.20",
    "pyarrow>=18",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "selectolax>=0.3.27",
    "marimo>=0.10",
    "tqdm>=4.66",
    "tabulate>=0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
# Themenanalyse (AP11) – zieht PyTorch nach, deshalb getrennt
topics = ["bertopic>=0.16", "sentence-transformers>=3.3", "umap-learn>=0.5", "hdbscan>=0.8.40"]
# Klassifikation mit wenigen Beispielen (AP10)
ml = ["setfit>=1.1", "sentence-transformers>=3.3", "transformers>=4.45"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sov"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
